version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    networks:
      - skillbridge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillbridge-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - skillbridge-net

networks:
  skillbridge-net:
    driver: bridge
